<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Aarya Chaurasia — Data Engineering, AI Systems & Quantitative Research</title>
  <meta name="description"
    content="Portfolio of Aarya Chaurasia — UBC Statistics & Computer Science. Incoming Data Engineer Co-op @ Ericsson, AI Automation Engineer Intern @ Mackenzie Investments, Quant Researcher @ UBCTG, Founder @ StatGit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #0b0c10;
      --paper: #f2efe9;
      --signal: oklch(74% 0.19 185);
      --signal-d: oklch(54% 0.16 185);
      --signal-bg: oklch(74% 0.19 185 / 0.08);
      --signal-bd: oklch(74% 0.19 185 / 0.35);
      --gold: oklch(76% 0.14 80);
      --gold-bg: oklch(76% 0.14 80 / 0.09);
      --muted: oklch(62% 0.01 240);
      --dim: oklch(44% 0.01 240);
      --border: oklch(22% 0.008 240);
      --surf: oklch(14% 0.006 240);
      --surf2: oklch(18% 0.008 240);
      --fn-disp: 'Syne', sans-serif;
      --fn-serif: 'DM Serif Display', Georgia, serif;
      --fn-mono: 'JetBrains Mono', monospace;
      --nav-h: 74px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--fn-disp);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Enable custom cursor only on fine-pointer (desktop) devices */
    @media (hover: hover) and (pointer: fine) {

      body,
      a,
      button,
      [role="button"],
      input,
      select {
        cursor: none;
      }
    }

    @media (hover: none),
    (pointer: coarse) {

      #c-dot,
      #c-ring {
        display: none !important;
      }
    }

    ::selection {
      background: var(--signal);
      color: var(--ink);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--ink);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--signal);
      border-radius: 2px;
    }

    /* ── CUSTOM CURSOR ── */
    #c-dot {
      position: fixed;
      top: -20px;
      left: -20px;
      z-index: 10000;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--signal);
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px var(--signal), 0 0 4px var(--signal);
      transition: width .15s, height .15s, background .2s;
    }

    #c-ring {
      position: fixed;
      top: -40px;
      left: -40px;
      z-index: 9999;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid oklch(74% 0.19 185 / 0.45);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width .25s cubic-bezier(.16, 1, .3, 1),
        height .25s cubic-bezier(.16, 1, .3, 1),
        border-color .2s;
    }

    body.hov #c-dot {
      width: 11px;
      height: 11px;
      background: var(--gold);
      box-shadow: 0 0 18px var(--gold);
    }

    body.hov #c-ring {
      width: 54px;
      height: 54px;
      border-color: oklch(76% 0.14 80 / 0.5);
    }

    /* ── NOISE OVERLAY ── */
    #noise {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .024;
      mix-blend-mode: screen;
    }

    /* ── NAVIGATION ── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 600;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 64px);
      background: oklch(11% 0.006 240 / 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid oklch(100% 0 0 / 0.07);
      transition: background .3s, border-color .3s;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--paper);
    }

    .nav-monogram {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--signal-bd);
      background: var(--signal-bg);
      display: grid;
      place-items: center;
      font-family: var(--fn-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--signal);
      letter-spacing: .08em;
    }

    .nav-name {
      font-family: var(--fn-mono);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--paper);
      opacity: .9;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.5vw, 36px);
      list-style: none;
    }

    .nav-center a {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: color .25s;
      position: relative;
      padding: 6px 0;
    }

    .nav-center a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--signal);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s cubic-bezier(.16, 1, .3, 1);
    }

    .nav-center a:hover,
    .nav-center a.active {
      color: var(--paper);
    }

    .nav-center a:hover::after,
    .nav-center a.active::after {
      transform: scaleX(1);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cmd-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--muted);
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 11px;
      transition: all .2s;
    }

    .cmd-btn:hover {
      color: var(--paper);
      border-color: var(--signal-bd);
      background: var(--surf2);
    }

    .cmd-kbd {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: oklch(100% 0 0 / 0.06);
      color: var(--signal);
      border: 1px solid oklch(100% 0 0 / 0.1);
    }

    .resume-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--fn-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--signal);
      border: 1px solid var(--signal);
      border-radius: 6px;
      padding: 8px 14px;
      transition: all .2s;
    }

    .resume-nav-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px oklch(74% 0.19 185 / 0.4);
      transform: translateY(-1px);
    }

    .mob-menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surf);
      color: var(--paper);
      align-items: center;
      justify-content: center;
      font-family: var(--fn-mono);
      font-size: 15px;
    }

    /* Mobile Drawer */
    .mob-drawer {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 590;
      background: oklch(10% 0.006 240 / 0.97);
      backdrop-filter: blur(20px);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateY(-105%);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1);
      pointer-events: none;
    }

    .mob-drawer.open {
      transform: translateY(0);
      pointer-events: auto;
    }

    .mob-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mob-links a {
      font-family: var(--fn-disp);
      font-size: 28px;
      font-weight: 800;
      color: var(--paper);
      text-decoration: none;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .mob-links a span {
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--signal);
      letter-spacing: .18em;
      font-weight: 400;
    }

    /* ── HERO SECTION ── */
    #hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: calc(var(--nav-h) + 36px) clamp(20px, 5vw, 64px) 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .hero-top-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--signal-bg);
      border: 1px solid var(--signal-bd);
      font-family: var(--fn-mono);
      font-size: clamp(9px, 1.1vw, 11px);
      letter-spacing: .12em;
      color: var(--signal);
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 10px var(--signal);
      animation: pulseDot 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .35;
        transform: scale(.85);
      }
    }

    .hero-top-right {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: right;
      line-height: 1.8;
    }

    .hero-main {
      position: relative;
      z-index: 2;
      max-width: 1240px;
      width: 100%;
      margin: auto;
      padding: clamp(32px, 6vh, 72px) 0;
    }

    .hero-eyebrow {
      font-family: var(--fn-mono);
      font-size: clamp(10px, 1.2vw, 12px);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-name-wrap {
      line-height: .9;
    }

    .hero-line {
      display: block;
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: clamp(46px, 9.2vw, 134px);
      letter-spacing: -.025em;
    }

    .hero-line-1 {
      color: var(--paper);
    }

    .hero-line-2 {
      color: transparent;
      -webkit-text-stroke: 1.5px oklch(48% .01 240);
    }

    .hero-line-2 .outline-signal {
      -webkit-text-stroke: 1.5px var(--signal);
      color: oklch(74% 0.19 185 / 0.08);
    }

    .hero-role-tags {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .role-chip {
      font-family: var(--fn-mono);
      font-size: clamp(10px, 1.1vw, 11px);
      letter-spacing: .1em;
      color: var(--paper);
      background: var(--surf2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 5px;
    }

    .role-chip strong {
      color: var(--signal);
      font-weight: 600;
    }

    .hero-bottom {
      position: relative;
      z-index: 2;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 28px;
      padding-top: 24px;
      border-top: 1px solid oklch(100% 0 0 / 0.08);
    }

    .hero-desc {
      font-family: var(--fn-serif);
      font-style: italic;
      font-size: clamp(17px, 1.8vw, 22px);
      color: var(--muted);
      max-width: 560px;
      line-height: 1.55;
      border-left: 2px solid var(--signal);
      padding-left: 20px;
    }

    .hero-desc em {
      font-style: normal;
      color: var(--paper);
    }

    .hero-cta-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
    }

    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--fn-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 12px 20px;
      border-radius: 6px;
      background: var(--signal);
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--signal);
      transition: all .22s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px oklch(74% 0.19 185 / 0.35);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--fn-mono);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 12px 18px;
      border-radius: 6px;
      background: var(--surf);
      color: var(--paper);
      text-decoration: none;
      border: 1px solid var(--border);
      transition: all .22s;
    }

    .btn-secondary:hover {
      border-color: var(--signal);
      color: var(--signal);
      background: var(--signal-bg);
    }

    .quick-socials {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .social-pill {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .social-pill:hover {
      color: var(--paper);
      border-color: var(--signal-bd);
      background: var(--surf2);
    }

    /* ── IMPACT METRICS STRIP ── */
    .metrics-strip {
      position: relative;
      z-index: 2;
      background: var(--surf);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .metrics-grid {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .metric-cell {
      padding: 28px 24px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: background .25s;
    }

    .metric-cell:last-child {
      border-right: none;
    }

    .metric-cell:hover {
      background: var(--surf2);
    }

    .metric-val {
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: clamp(24px, 2.4vw, 34px);
      color: var(--paper);
      letter-spacing: -.02em;
      line-height: 1.05;
    }

    .metric-val span {
      color: var(--signal);
    }

    .metric-lbl {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .06em;
      line-height: 1.5;
    }

    .metric-tag {
      font-family: var(--fn-mono);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 4px;
    }

    /* ── MARQUEE ── */
    .marquee-strip {
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      background: oklch(12% 0.005 240);
    }

    .marquee-inner {
      display: flex;
      white-space: nowrap;
      animation: marquee 34s linear infinite;
    }

    .marquee-inner:hover {
      animation-play-state: paused;
    }

    .marquee-item {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 0 32px;
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .marquee-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--signal);
      flex-shrink: 0;
    }

    @keyframes marquee {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    /* ── SHARED SECTION STYLES ── */
    section {
      position: relative;
      z-index: 1;
      overflow: hidden;
      scroll-margin-top: var(--nav-h);
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 clamp(20px, 5vw, 64px);
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 64px;
    }

    .sec-label {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .26em;
      color: var(--signal);
      text-transform: uppercase;
      display: block;
      margin-bottom: 12px;
    }

    .sec-title {
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: clamp(36px, 5vw, 72px);
      color: var(--paper);
      letter-spacing: -.025em;
      line-height: .95;
    }

    .ghost-num {
      position: absolute;
      right: clamp(16px, 4vw, 48px);
      top: 64px;
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: clamp(90px, 13vw, 170px);
      color: oklch(100% 0 0 / 0.025);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      letter-spacing: -.04em;
      z-index: 0;
    }

    /* Fade-in animation */
    .fi {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .75s cubic-bezier(.16, 1, .3, 1), transform .75s cubic-bezier(.16, 1, .3, 1);
    }

    .fi.vis {
      opacity: 1;
      transform: none;
    }

    /* Active skill filter banner */
    .skill-filter-banner {
      margin-bottom: 32px;
      padding: 12px 18px;
      background: var(--signal-bg);
      border: 1px solid var(--signal-bd);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--paper);
    }

    .skill-filter-banner button {
      font-family: var(--fn-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--ink);
      color: var(--signal);
      border: 1px solid var(--signal-bd);
    }

    /* ── 01: EXPERIENCE SECTION ── */
    #experience {
      padding: clamp(80px, 10vw, 130px) 0;
    }

    .exp-timeline {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .exp-card {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      padding: clamp(36px, 5vw, 56px) 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background .3s;
    }

    .exp-card:hover {
      background: oklch(15% 0.006 240 / 0.65);
    }

    .exp-card.highlighted {
      background: var(--signal-bg);
      border-left: 3px solid var(--signal);
    }

    .exp-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--signal);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .4s cubic-bezier(.16, 1, .3, 1);
    }

    .exp-card:hover::before {
      transform: scaleY(1);
    }

    .exp-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exp-period {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--signal);
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .exp-badge {
      display: inline-block;
      width: fit-content;
      font-family: var(--fn-mono);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid oklch(76% 0.14 80 / 0.3);
      margin-top: 2px;
    }

    .exp-company {
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: 22px;
      color: var(--paper);
      letter-spacing: -.01em;
      margin-top: 4px;
    }

    .exp-loc {
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .06em;
    }

    .exp-ext-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .exp-ext-link {
      font-family: var(--fn-mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--paper);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--surf2);
      transition: all .2s;
    }

    .exp-ext-link:hover {
      border-color: var(--signal);
      color: var(--signal);
    }

    .exp-content {
      display: flex;
      flex-direction: column;
    }

    .exp-role-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .exp-role {
      font-family: var(--fn-disp);
      font-weight: 700;
      font-size: clamp(20px, 2.2vw, 28px);
      color: var(--paper);
      letter-spacing: -.01em;
      line-height: 1.15;
    }

    .exp-impact-pill {
      font-family: var(--fn-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--signal);
      background: var(--signal-bg);
      border: 1px solid var(--signal-bd);
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .exp-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 760px;
    }

    .exp-bullets li {
      font-size: 14.5px;
      color: oklch(72% .006 240);
      padding-left: 22px;
      position: relative;
      line-height: 1.7;
    }

    .exp-bullets li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--signal);
      font-family: var(--fn-mono);
      font-size: 12px;
    }

    .exp-bullets li strong {
      color: var(--paper);
      font-weight: 600;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 22px;
    }

    .tech-tag {
      font-family: var(--fn-mono);
      font-size: 9.5px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surf);
      padding: 4px 10px;
      border-radius: 4px;
      transition: all .2s;
    }

    .tech-tag:hover,
    .tech-tag.active {
      color: var(--signal);
      border-color: var(--signal);
      background: var(--signal-bg);
    }

    /* ── 02: WORK / PROJECTS SECTION ── */
    #work {
      padding: clamp(80px, 10vw, 130px) 0;
      border-top: 1px solid var(--border);
      background: oklch(12% 0.005 240 / 0.5);
    }

    .work-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 36px;
    }

    .work-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .wf {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 9px 16px;
      border-radius: 6px;
      background: var(--surf);
      color: var(--muted);
      border: 1px solid var(--border);
      transition: all .2s;
    }

    .wf.on {
      color: var(--ink);
      background: var(--signal);
      border-color: var(--signal);
      font-weight: 600;
    }

    .wf:hover:not(.on) {
      color: var(--paper);
      border-color: var(--signal-bd);
    }

    .work-search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .work-search {
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--paper);
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      min-width: 220px;
      outline: none;
      transition: border-color .2s;
    }

    .work-search:focus {
      border-color: var(--signal);
    }

    .expand-all-btn {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 9px 14px;
      border-radius: 6px;
      background: var(--surf);
      color: var(--muted);
      border: 1px solid var(--border);
      transition: all .2s;
    }

    .expand-all-btn:hover {
      color: var(--paper);
      border-color: var(--signal-bd);
    }

    .project-list {
      border-top: 1px solid var(--border);
    }

    .project-row {
      display: grid;
      grid-template-columns: 64px 1fr 230px;
      border-bottom: 1px solid var(--border);
      transition: background .3s;
      position: relative;
      overflow: hidden;
    }

    .project-row:hover {
      background: var(--surf);
    }

    .project-row.highlighted {
      background: var(--signal-bg);
      border-left: 3px solid var(--signal);
    }

    .project-row::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--signal);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform .45s cubic-bezier(.16, 1, .3, 1);
    }

    .project-row:hover::after {
      transform: scaleY(1);
    }

    .proj-idx {
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--dim);
      padding: 36px 0 36px 12px;
      letter-spacing: .1em;
    }

    .proj-main {
      padding: 36px 40px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .proj-top-line {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .proj-title {
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: clamp(22px, 2.5vw, 34px);
      color: var(--paper);
      letter-spacing: -.015em;
      line-height: 1.05;
      transition: color .25s;
    }

    .project-row:hover .proj-title {
      color: var(--signal);
    }

    .proj-benchmark {
      font-family: var(--fn-mono);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--signal-bg);
      color: var(--signal);
      border: 1px solid var(--signal-bd);
    }

    .proj-featured-badge {
      font-family: var(--fn-mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid oklch(76% 0.14 80 / 0.35);
    }

    .proj-sub {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--fn-mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .proj-desc {
      font-size: 14.5px;
      color: oklch(68% .006 240);
      line-height: 1.7;
      max-width: 680px;
    }

    .proj-expand {
      overflow: hidden;
      max-height: 0;
      transition: max-height .5s cubic-bezier(.16, 1, .3, 1);
    }

    .project-row.open .proj-expand {
      max-height: 600px;
    }

    .proj-bullets {
      list-style: none;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .proj-bullets li {
      font-size: 13.5px;
      color: oklch(72% .006 240);
      padding-left: 20px;
      position: relative;
      line-height: 1.65;
    }

    .proj-bullets li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--signal);
      font-family: var(--fn-mono);
    }

    .proj-side {
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
    }

    .proj-date {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: right;
    }

    .proj-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .proj-link {
      font-family: var(--fn-mono);
      font-size: 9.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--paper);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surf2);
      padding: 6px 11px;
      border-radius: 4px;
      transition: all .2s;
    }

    .proj-link:hover {
      color: var(--ink);
      background: var(--signal);
      border-color: var(--signal);
    }

    .proj-toggle {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .project-row:hover .proj-toggle {
      color: var(--signal);
    }

    .proj-chevron {
      transition: transform .35s cubic-bezier(.16, 1, .3, 1);
      display: inline-block;
    }

    .project-row.open .proj-chevron {
      transform: rotate(180deg);
    }

    /* ── 03: SKILLS & ARSENAL ── */
    #skills {
      padding: clamp(80px, 10vw, 130px) 0;
      border-top: 1px solid var(--border);
    }

    .skills-helper {
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--muted);
      max-width: 460px;
      line-height: 1.6;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .skill-card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      transition: border-color .25s, transform .25s;
    }

    .skill-card:hover {
      border-color: var(--signal-bd);
    }

    .sk-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sk-title {
      font-family: var(--fn-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2em;
      color: var(--signal);
      text-transform: uppercase;
    }

    .sk-count {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--dim);
    }

    .sk-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sk-pill {
      font-family: var(--fn-mono);
      font-size: 11px;
      color: var(--paper);
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 13px;
      transition: all .2s;
    }

    .sk-pill:hover,
    .sk-pill.active {
      color: var(--ink);
      background: var(--signal);
      border-color: var(--signal);
      font-weight: 600;
      transform: translateY(-1px);
    }

    /* ── 04: ABOUT & EDUCATION ── */
    #about {
      padding: clamp(80px, 10vw, 130px) 0;
      border-top: 1px solid var(--border);
      background: var(--surf);
    }

    .about-pullquote {
      font-family: var(--fn-serif);
      font-style: italic;
      font-size: clamp(22px, 2.8vw, 38px);
      color: var(--paper);
      line-height: 1.35;
      margin: 12px 0 56px;
      padding-left: 28px;
      border-left: 3px solid var(--signal);
      max-width: 820px;
    }

    .about-pullquote em {
      font-style: normal;
      color: var(--signal);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 56px;
      align-items: start;
    }

    .about-text {
      font-size: 16px;
      line-height: 1.85;
      color: oklch(70% .006 240);
    }

    .about-text p+p {
      margin-top: 20px;
    }

    .about-text strong {
      color: var(--paper);
      font-weight: 600;
    }

    /* Education Card */
    .edu-card {
      margin-top: 36px;
      padding: 28px;
      background: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
    }

    .edu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .edu-school {
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: 22px;
      color: var(--paper);
    }

    .edu-date {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--signal);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .edu-degree {
      font-family: var(--fn-serif);
      font-style: italic;
      font-size: 17px;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .coursework-label {
      font-family: var(--fn-mono);
      font-size: 9.5px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .coursework-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cw-pill {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--paper);
      background: var(--surf2);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 4px;
    }

    /* Live Telemetry / Currently Widget */
    .currently-box {
      padding: 28px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .currently-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--signal);
    }

    .curr-label {
      font-family: var(--fn-mono);
      font-size: 10px;
      letter-spacing: .22em;
      color: var(--signal);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .curr-label::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 8px var(--signal);
    }

    .curr-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 13px 0;
      border-top: 1px solid var(--border);
    }

    .curr-k {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .curr-v {
      font-family: var(--fn-disp);
      font-size: 13.5px;
      color: var(--paper);
      font-weight: 600;
      text-align: right;
    }

    /* ── 05: CONTACT ── */
    #contact {
      padding: clamp(90px, 12vw, 150px) 0;
      border-top: 1px solid var(--border);
    }

    .contact-big {
      font-family: var(--fn-disp);
      font-weight: 800;
      font-size: clamp(38px, 6vw, 84px);
      color: var(--paper);
      letter-spacing: -.025em;
      line-height: .94;
      margin-bottom: 56px;
      max-width: 860px;
    }

    .contact-big em {
      font-style: italic;
      font-family: var(--fn-serif);
      font-weight: 400;
      color: var(--signal);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: start;
    }

    .contact-sub {
      font-family: var(--fn-serif);
      font-style: italic;
      font-size: clamp(17px, 1.8vw, 22px);
      color: var(--muted);
      line-height: 1.65;
      max-width: 460px;
      margin-bottom: 28px;
    }

    .contact-sub em {
      font-style: normal;
      color: var(--paper);
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .c-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 12px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--paper);
      transition: all .25s;
      background: transparent;
      width: 100%;
      text-align: left;
      border-left: none;
      border-right: none;
    }

    .c-link:hover {
      padding-left: 22px;
      background: var(--surf);
    }

    .c-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .c-type {
      font-family: var(--fn-mono);
      font-size: 9.5px;
      color: var(--signal);
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .c-val {
      font-family: var(--fn-disp);
      font-weight: 700;
      font-size: clamp(17px, 2vw, 22px);
      letter-spacing: -.01em;
    }

    .c-arr {
      font-family: var(--fn-mono);
      font-size: 13px;
      color: var(--muted);
      transition: all .25s;
    }

    .c-link:hover .c-arr {
      color: var(--signal);
      transform: translate(4px, -2px);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px clamp(20px, 5vw, 64px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--surf);
      position: relative;
      z-index: 1;
    }

    .foot-l,
    .foot-r {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .foot-btn {
      font-family: var(--fn-mono);
      font-size: 10px;
      color: var(--signal);
      background: transparent;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .12em;
      transition: all .2s;
    }

    .foot-btn:hover {
      border-color: var(--signal);
      background: var(--signal-bg);
    }

    /* ── MODALS (RESUME & COMMAND PALETTE) ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: oklch(5% 0.005 240 / 0.82);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn .2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Command Palette */
    .cmd-modal {
      width: 100%;
      max-width: 600px;
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 32px 90px oklch(0% 0 0 / 0.85);
    }

    .cmd-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .cmd-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--fn-mono);
      font-size: 14px;
      color: var(--paper);
    }

    .cmd-list {
      max-height: 360px;
      overflow-y: auto;
      padding: 8px;
    }

    .cmd-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--paper);
      text-align: left;
      font-family: var(--fn-mono);
      font-size: 12px;
      transition: background .15s;
    }

    .cmd-item:hover {
      background: var(--surf2);
      color: var(--signal);
    }

    .cmd-item-cat {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    /* Resume Viewer Modal */
    .resume-modal {

  <script>
    /* ── CUSTOM CURSOR & NOISE ── */
    const dot = document.getElementById('c-dot');
    const ring = document.getElementById('c-ring');
    const isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (isFinePointer) {
      let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my;
      window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; }, { passive: true });
      (function cursorLoop() {
        dot.style.left = mx + 'px'; dot.style.top = my + 'px';
        rx += (mx - rx) * 0.14; ry += (my - ry) * 0.14;
        ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
        requestAnimationFrame(cursorLoop);
      })();
      document.addEventListener('mouseover', e => {
        if (e.target.closest('a,button,.project-row,.c-link,.wf,.sk-pill,.tech-tag,select,input'))
          document.body.classList.add('hov');
        else document.body.classList.remove('hov');
      });
    }

    /* ── STATIC/LOW-OVERHEAD NOISE CANVAS ── */
    const nc = document.getElementById('noise');
    const nctx = nc.getContext('2d');
    function renderNoise() {
      const W = nc.width = 256;
      const H = nc.height = 256;
      const id = nctx.createImageData(W, H);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      nctx.putImageData(id, 0, 0);
    }
    renderNoise();

    /* ── TWEAKS CONTROLS ── */
    document.getElementById('twk-close').addEventListener('click', () => {
      document.getElementById('tweaks-panel').classList.remove('on');
    });
    document.getElementById('twk-signal').addEventListener('change', function () {
      const h = this.value;
      document.documentElement.style.setProperty('--signal', `oklch(74% 0.19 ${h})`);
      document.documentElement.style.setProperty('--signal-d', `oklch(54% 0.16 ${h})`);
      document.documentElement.style.setProperty('--signal-bg', `oklch(74% 0.19 ${h} / 0.08)`);
      document.documentElement.style.setProperty('--signal-bd', `oklch(74% 0.19 ${h} / 0.35)`);
    });
    document.getElementById('twk-bg').addEventListener('input', function () {
      const v = parseInt(this.value, 10);
      document.documentElement.style.setProperty('--ink', `oklch(${v}% 0.006 240)`);
      document.documentElement.style.setProperty('--surf', `oklch(${v + 3}% 0.006 240)`);
      document.documentElement.style.setProperty('--surf2', `oklch(${v + 7}% 0.008 240)`);
      document.documentElement.style.setProperty('--border', `oklch(${v + 11}% 0.008 240)`);
    });
    document.getElementById('twk-noise').addEventListener('input', function () {
      nc.style.opacity = this.value / 100;
    });
  </script>

    const { useState, useEffect, useRef, useMemo } = React;

    /* ── RAW LATEX RESUME SOURCE FOR 1-CLICK COPY ── */
    const LATEX_RESUME = document.getElementById('latex-resume-source').textContent.trim();

    /* ── CLIPBOARD HELPER ── */
    function copyToClipboard(text, onDone) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
      } else {
        fallbackCopy(text, onDone);
      }
    }
    function fallbackCopy(text, onDone) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { }
      document.body.removeChild(ta);
      if (onDone) onDone();
    }

    /* ── INTERSECTION OBSERVER HOOK ── */
    function FI({ children, delay = 0, className = '' }) {
      const ref = useRef();
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        el.classList.add('fi');
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) {
            setTimeout(() => el.classList.add('vis'), delay);
            obs.disconnect();
          }
        }, { threshold: 0.05 });
        obs.observe(el);
        return () => obs.disconnect();
      }, [delay]);
      return <div ref={ref} className={className}>{children}</div>;
    }

    /* ── HERO BACKGROUND CANVAS ── */
    function HeroCanvas() {
      const ref = useRef();
      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let W, H, t = 0, animId;
        function resize() {
          W = canvas.width = canvas.offsetWidth;
          H = canvas.height = canvas.offsetHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        function draw() {
          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = 'oklch(100% 0 0 / 0.04)';
          const spacing = 54;
          for (let x = 0; x < W; x += spacing) {
            for (let y = 0; y < H; y += spacing) {
              const pulse = Math.sin(t * 0.008 + x * 0.015 + y * 0.015) * 0.5 + 0.5;
              ctx.globalAlpha = pulse * 0.055;
              ctx.beginPath();
              ctx.arc(x, y, 1.1, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          ctx.beginPath();
          const amp = H * 0.038, freq = 0.0055;
          for (let x = 0; x <= W; x += 2) {
            const y = H * 0.58
              + Math.sin((x * freq + t * 0.01) * Math.PI * 2) * amp
              + Math.sin((x * freq * 0.5 + t * 0.007) * Math.PI * 2) * amp * 0.6;
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          const grad = ctx.createLinearGradient(0, 0, W, 0);
          grad.addColorStop(0, 'oklch(74% 0.19 185 / 0)');
          grad.addColorStop(0.3, 'oklch(74% 0.19 185 / 0.42)');
          grad.addColorStop(0.7, 'oklch(74% 0.19 185 / 0.32)');
          grad.addColorStop(1, 'oklch(74% 0.19 185 / 0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          t++;

                    </a>

                    <a className="c-link" href="https://www.linkedin.com/in/aarya-chaurasia/" target="_blank" rel="noopener noreferrer">
                      <div className="c-inner">
                        <span className="c-type">LinkedIn</span>
                        <span className="c-val">linkedin.com/in/aarya-chaurasia</span>
                      </div>
                      <span className="c-arr">↗</span>
                    </a>

                    <a className="c-link" href="https://statgit.com/" target="_blank" rel="noopener noreferrer">
                      <div className="c-inner">
                        <span className="c-type">StatGit Platform</span>
                        <span className="c-val">statgit.com</span>
                      </div>
                      <span className="c-arr">↗</span>
                    </a>
                  </div>
                </FI>
              </div>
            </div>
          </section>

          {/* ── FOOTER ── */}
          <footer>
            <div className="foot-l">
              <span>Aarya Chaurasia · Vancouver, BC &amp; Toronto, ON</span>
              <span>·</span>
              <span>UBC BSc Statistics &amp; Computer Science</span>
            </div>
            <div className="foot-r">
              <button className="foot-btn" onClick={() => setCmdOpen(true)}>⌘K Command Palette</button>
              <button
                className="foot-btn"
                onClick={() => document.getElementById('tweaks-panel').classList.toggle('on')}
              >
                ⊙ Theme Tweaks
              </button>
            </div>
          </footer>

          {/* ── MODALS & TOAST ── */}
          {resumeOpen && <ResumeModal onClose={() => setResumeOpen(false)} showToast={triggerToast} />}
          {cmdOpen && (
            <CommandPalette
              onClose={() => setCmdOpen(false)}
              onOpenResume={() => setResumeOpen(true)}
              showToast={triggerToast}
            />
          )}
          {toast && <div className="toast-msg">{toast}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
